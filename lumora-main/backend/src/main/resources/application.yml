spring:
  application:
    name: lumora-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5544/Lumora}
    username: ${DB_USER:nexus}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: public
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true
    connect-retries: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: public
        jdbc:
          time_zone: UTC
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
