# ============================================================
#  Cấu hình ứng dụng Lumora Backend
# ============================================================

spring.application.name=lumora-backend
server.port=8080

# ---- Kết nối PostgreSQL (đổi theo pgAdmin 4 của bạn) --------
# Tạo database tên "lumora-main" trong pgAdmin trước (xem README).
spring.datasource.url=jdbc:postgresql://localhost:5432/lumora-main
spring.datasource.username=postgres
spring.datasource.password=123
spring.datasource.driver-class-name=org.postgresql.Driver

# Bảng được tạo thủ công trong pgAdmin (chạy db/schema.sql),
# nên KHÔNG để Spring tự tạo/sửa bảng.
spring.sql.init.mode=never

# ---- JWT ---------------------------------------------------
# Khoá ký token: phải >= 32 ký tự. ĐỔI chuỗi này ở môi trường thật!
app.jwt.secret=change-this-super-secret-lumora-key-min-32-chars-long-0123456789
# Thời hạn token (ms): 86400000 = 24 giờ
app.jwt.expiration-ms=86400000

# ---- Google Sign-In ----------------------------------------
# Dán Client ID (loại "Web application") lấy từ Google Cloud Console vào
# ngay sau dấu "=" bên dưới. KHÔNG cần Client Secret.
# Để trống = tắt đăng nhập Google (nút sẽ bị khoá, app vẫn chạy bình thường).
app.google.client-id=155391574653-dl6uije8oc1qdngofq9pqi5bj8cs58t4.apps.googleusercontent.com

# ---- Đăng nhập Zalo (OAuth v4 + PKCE) ----------------------
# Lấy tại https://developers.zalo.me/ (tạo App + liên kết Official Account).
# Dán App ID và Secret Key vào sau dấu "=". Để trống = tắt đăng nhập Zalo.
app.zalo.app-id=
app.zalo.secret-key=

# ---- CORS: cho phép frontend Vite gọi API ------------------
app.cors.allowed-origins=http://localhost:5173,http://localhost:5174

# ---- Log SQL khi phát triển (tuỳ chọn) ---------------------
logging.level.org.springframework.jdbc.core=INFO
